# Stamped for spring-petclinic-rest-legacy (template specimen profile).
# Root fix: app-migration skeleton selects this from legacyRepoUrl — do not
# ship Coolstore cart defaults into non-cart runs.
migration:
  legacyRepoUrl: https://github.com/adnan-drina/spring-petclinic-rest-legacy
  target: quarkus
  provisionedBy: app-migration golden-path template
  needsDatabase: true
  legacyPackage: org.springframework.samples.petclinic
  targetPackage: com.demo
acceptance:
  path: /petclinic/api/vets
  collection: _array
  getter: getAllVets
  service: VetRestController
  itemType: VetDto
  needsDatabase: true
  idFields: [id]
analysis:
  mode: source-only
  targets:
    - quarkus
    - jakarta-ee9
    - cloud-readiness
    - openjdk17
    - openjdk21
targetContract:
  validateInput: true
  mapErrors: true
  getIdempotent: true
  threadSafeState: false
  cacheRefreshGuard: true
  normalizeBeforeDerive: false
configTransforms:
  - from: server.port
    to: quarkus.http.port
    valueMap:
      "9966": "8080"
preserve:
  - petclinic.security.enable
  - server.servlet.context-path
forbidden: []
contract:
  status: decided
  profile: spring-petclinic-rest-legacy
