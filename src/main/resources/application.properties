# Quarkus configuration
# Default remains postgresql for non-g4; g4 profile is H2 for Owner/Pet REST probe.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=petclinic
quarkus.datasource.password=petclinic
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/petclinic
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.springframework".level=WARN

# %g4 — build-time sensitive datasource/hibernate keys included so -Dquarkus.profile=g4 works
%g4.quarkus.http.port=8080
%g4.quarkus.datasource.db-kind=other
%g4.quarkus.datasource.jdbc.driver=org.h2.Driver
%g4.quarkus.datasource.username=sa
%g4.quarkus.datasource.password=
%g4.quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1
%g4.quarkus.hibernate-orm.database.generation=drop-and-create
%g4.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%g4.quarkus.hibernate-orm.sql-load-script=import-g4.sql
%g4.quarkus.hibernate-orm.log.sql=false

# %g4-secure — build-time datasource/hibernate keys (security-on probe)
%g4-secure.quarkus.http.port=8080
%g4-secure.quarkus.datasource.db-kind=other
%g4-secure.quarkus.datasource.jdbc.driver=org.h2.Driver
%g4-secure.quarkus.datasource.username=sa
%g4-secure.quarkus.datasource.password=
%g4-secure.quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1
%g4-secure.quarkus.hibernate-orm.database.generation=drop-and-create
%g4-secure.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%g4-secure.quarkus.hibernate-orm.sql-load-script=import-g4.sql
%g4-secure.quarkus.hibernate-orm.log.sql=false


%g4.quarkus.http.auth.permission.public.paths=/*
%g4.quarkus.http.auth.permission.public.policy=permit
