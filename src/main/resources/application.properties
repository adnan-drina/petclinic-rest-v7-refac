# Quarkus configuration
quarkus.profile=test
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=petclinic
quarkus.datasource.password=petclinic
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/petclinic
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.springframework".level=WARN

# Validation
quarkus.validation.enabled=true

# JSON configuration
quarkus.json.enabled=true
