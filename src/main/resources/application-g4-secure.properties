# G-4 security-on probe — same H2 seed as %g4 + embedded basic auth (admin/admin, OWNER_ADMIN).
# Harvested posture from referent BasicAuthenticationConfig + populateDB users.
# db-kind=other avoids quarkus-jdbc-h2 (redhat GA DNS blocked in workspace).
quarkus.http.port=8080
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.sql-load-script=import-g4.sql
quarkus.hibernate-orm.log.sql=false

quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin
quarkus.security.users.embedded.roles.admin=OWNER_ADMIN

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
